name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        # Pinned to the version the site and the WebR primers were verified on.
        # The quarto-live extension in _extensions/ was built against it; a
        # different CI version is an untested render.
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.36

      # R IS required, even though no R code on this site is ever executed.
      # The 9 primers declare `engine: knitr`, and quarto-live's _knitr.qmd
      # include registers a passthrough knitr engine that rewrites each {webr}
      # block into the page. So knitr has to run the document, even though the
      # R inside a {webr} cell is shipped to the reader's browser and evaluated
      # there, never here. Dropping this step fails the render at the first
      # primer with "Unable to locate an installed version of R".
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only the authoring stack. The teaching packages (tidyverse, gtsummary,
      # epitools and the rest) belong in setup/install_packages.R, which
      # participants run on their own laptops. Nothing here evaluates them, so
      # installing them in CI would add many minutes and verify nothing.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown

      - name: Render site
        run: quarto render

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
